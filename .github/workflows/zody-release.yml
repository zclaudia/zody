name: Zody tag candidate

on:
  push:
    tags: ["v*"]

concurrency:
  group: zody-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and root version
        run: node scripts/zody-distribution/validate-release-tag.mjs "$RELEASE_VERSION"
      - name: Verify third-party release obligations
        run: node scripts/licenses.mjs check --strict
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm architecture:check --changed
      - run: pnpm test:unit
      - run: pnpm --dir apps/zody-cli test
      - run: pnpm --dir apps/zody-cli typecheck
      - run: pnpm --dir apps/zody-cli lint
      - run: node --test scripts/zody-distribution-runner.test.mjs scripts/zody-distribution.test.mjs scripts/zody-distribution-smoke.test.mjs

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            os: mac
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            os: mac
            arch: x64
          - target: win32-x64
            runner: windows-2025
            os: win
            arch: x64
          - target: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned Desktop artifacts
        shell: bash
        env:
          ZODY_ENV: production
          ZODY_ENABLE_MAC_SIGN: "0"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --dir packages/desktop run bundle --os "${{ matrix.os }}" --arch "${{ matrix.arch }}"
      - name: Collect Desktop artifacts
        shell: bash
        run: node scripts/zody-distribution/collect-desktop-artifact.mjs "${{ matrix.target }}" "$RUNNER_TEMP/zody-assets"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ runner.temp }}/zody-assets/*
          if-no-files-found: error
          retention-days: 14

  cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build self-contained CLI and Web archive
        shell: bash
        env:
          ZODY_ENV: production
        run: pnpm run build:zody --target "${{ matrix.target }}" --out-dir "$RUNNER_TEMP/zody"
      - name: Smoke extracted archive without Node on PATH
        shell: bash
        run: node scripts/zody-distribution/smoke-cli-archive.mjs "$RUNNER_TEMP/zody/releases/${RELEASE_VERSION#v}/zody-cli-${RELEASE_VERSION#v}-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cli-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/zody/releases/*/*.tar.gz
            ${{ runner.temp }}/zody/releases/*/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build signed Android release APK
        env:
          ZODY_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/zody-release.keystore
          ZODY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZODY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZODY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ZODY_ANDROID_KEYSTORE_FILE"
          test -s "$ZODY_ANDROID_KEYSTORE_FILE"
          cd packages/android
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$RUNNER_TEMP/zody-assets"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/zody-assets/zody-android-${RELEASE_VERSION#v}.apk"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-release
          path: ${{ runner.temp }}/zody-assets/*.apk
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: [validate, desktop, cli, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/zody-input
          merge-multiple: true
      - name: Assemble and validate release assets
        run: node scripts/zody-distribution/prepare-release-assets.mjs --version "${RELEASE_VERSION#v}" --input "$RUNNER_TEMP/zody-input" --output "$RUNNER_TEMP/zody-release"
      - name: Create or safely resume draft pre-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/zody-distribution/publish-draft-release.mjs "$RUNNER_TEMP/zody-release" "$RELEASE_VERSION"
