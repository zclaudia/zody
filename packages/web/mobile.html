<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 手机页面固定以设备宽度布局；viewport-fit 让安全区 inset 在端上生效。
         interactive-widget=resizes-content 是 Android Chromium 108+ 的键盘行为开关：键盘弹起时压缩
         initial containing block，100dvh 布局跟随缩小，底部输入区不被键盘遮挡（走查 searchfile-4）；
         iOS Safari 不识别并忽略该字段，iOS 侧避让由 installMobileKeyboardInsetTracker 承担。
         spec 见 docs/web-remote-control/mobile-viewport-input-and-touch.md §2.1。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <title>Zody</title>
    <!-- M2-T2：首屏主题从内联脚本外置为同源静态文件，Remote CSP script-src 'self'
         不需要 unsafe-inline；classic script 保持抽取前的阻塞式初始化顺序。 -->
    <script src="/assets/remote/mobile-theme-bootstrap.js"></script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-zcode-browser-theme-surface],
      html[data-zcode-browser-theme-surface] body,
      html[data-zcode-browser-theme-surface] #root {
        /* 与 index.html 同因：共享 UI 样式为 Electron vibrancy 强制透明根背景，
           浏览器/WebView 入口必须用语义背景覆盖，否则手机会露出系统白底。 */
        background: var(--color-background, var(--zcode-bootstrap-bg, #161616)) !important;
      }

      html[data-zcode-browser-theme-surface="light"],
      html[data-zcode-browser-theme-surface="light"] body,
      html[data-zcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--zcode-bootstrap-bg, #f8f8f8)) !important;
      }

      .zcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        font-size: 14px;
        letter-spacing: 0.08em;
        /* 预渲染壳自己承接主题背景，避免 bundle 执行前露出默认白底。 */
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-zcode-bootstrap-theme="light"] .zcode-boot-loading {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="zcode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        Zody
      </div>
    </div>
    <script type="module" src="/src/mobile-remote/main.tsx"></script>
  </body>
</html>
